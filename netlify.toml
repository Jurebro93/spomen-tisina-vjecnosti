# Netlify hosting for osmrtnica.com.hr: every merge to main is built and published.
# Routing rules (_redirects) are generated into dist/ by scripts/generate-netlify-redirects.mjs.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Page chunks have a content hash in their name (vite.config.ts), so a changed
# file always gets a new URL. Unhashed entry files (assets/index.js, vendor.js)
# keep Netlify's default revalidation.
[[headers]]
  for = "/assets/c/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
